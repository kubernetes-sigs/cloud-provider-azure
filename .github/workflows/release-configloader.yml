name: Release azclient configloader
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'pkg/azclient/configloader/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Required for creating and pushing git tags
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_prefix: pkg/azclient/configloader/v
        fetch_all_tags: true
