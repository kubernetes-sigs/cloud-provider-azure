version: "2"
run:
  modules-download-mode: mod
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - errcheck
    - errorlint
    - goconst
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    goconst:
      min-occurrences: 10
      # Keep table-driven test fixtures self-contained.
      ignore-tests: true
    gosec:
      excludes:
        - G114
        - G115
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Secret names and namespaces identify Kubernetes objects, not credentials.
      - linters:
          - gosec
        path: ^cmd/cloud-controller-manager/app/options/(dynamic|options_test)\.go$
        text: "G101:"
        source: '.*&DynamicReloadingOptions\{'
      # The test server intentionally returns a synthetic OAuth token.
      - linters:
          - gosec
        path: ^pkg/credentialprovider/identity_bindings_credentials_test\.go$
        text: "G117:"
        source: '.*json\.NewEncoder\(w\)\.Encode\(resp\)'
      # The subprocess reruns this test binary with a fixed table-driven test name.
      - linters:
          - gosec
        path: ^pkg/nodeipam/node_ipam_controller_test\.go$
        text: "G702:"
        source: '.*exec\.Command\(arg0, arg1\)'
      - linters:
          - gosec
        path: ^(pkg/provider/azure_test|pkg/util/iputil/bits)\.go$
        text: "G602: slice index out of range"
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library package names"
      - linters:
          - revive
        path: tests/e2e
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - sigs.k8s.io/cloud-provider-azure
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
