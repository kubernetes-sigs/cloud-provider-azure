cloudControllerManager:
  bindAddress: "127.0.0.1"
  certDir: "/certs"
  cloudConfigSecretName: "azure-cloud-provider"
  contentionProfiling: "false"
  controllerStartInterval: "2s"
  enableDynamicReloading: "true"
  http2MaxStreamsPerConnection: "47"
  kubeAPIBurst: "100"
  kubeAPIContentType: "application/vnd.kubernetes.protobuf"
  kubeAPIQPS: "50"
  kubeconfig: "/kubeconfig"
  leaderElectLeaseDuration: "30s"
  leaderElectRenewDeadline: "15s"
  leaderElectRetryPeriod: "5s"
  leaderElectResourceLock: "leases"
  master: "https://127.0.0.1:6443"
  minResyncPeriod: "100m"
  nodeStatusUpdateFrequency: "10m"
  profiling: "false"
  useServiceAccountCredentials: "false"
cloudNodeManager:
  cloudConfig: "/etc/kubernetes/azure.json"
  kubeAPIBurst: "100"
  kubeAPIContentType: "application/vnd.kubernetes.protobuf"
  kubeAPIQPS: "50"
  kubeconfig: "/kubeconfig"
  master: "https://127.0.0.1:6443"
  minResyncPeriod: "100m"
  nodeStatusUpdateFrequency: "10m"
  waitRoutes: "true"
  useInstanceMetadata: "false"
  enableHealthProbeProxy: true
